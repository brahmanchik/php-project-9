---


services:
  web:
    build:
      context: .
    command: sh -c "make db-prepare && make start"
    environment:
      DATABASE_URL: postgresql://page_analyzer:password@db:5432/page_analyzer
    ports:
      - "8080:8000"
    volumes:
      - ".:/app"
      - "/tmp:/tmp"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: page_analyzer
      POSTGRES_USER: page_analyzer
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U page_analyzer -d page_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

volumes:
  postgres_data:
